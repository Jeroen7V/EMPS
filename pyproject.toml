# This project is completely vibe coded: all code was generated by
# Mistral Vibe (AI). No human wrote a line of code. See AUTHORS.
[project]
name = "emps"
version = "0.1.0"
description = "ESCPOS Markdown Printing Service (EMPS): HTTP service that translates markdown to ESC/POS and prints it on a USB receipt printer"
authors = [{ name = "Jeroen Vermeylen", email = "jeroen@fork-it.be" }]
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-escpos>=3.1",
    "pyusb>=1.2",
    "mistune>=3.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["emps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
